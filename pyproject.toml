[project]
name = "llm-negotiation"
version = "0.1.0"
description = "Behavioral economics games (ultimatum, dictator, etc.) simulated with LLMs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyautogen>=0.2,<0.4",
    "python-dotenv",
    "pandas",
    "matplotlib",
    "seaborn",
    "jupyterlab",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[project.scripts]
llm-negotiation = "llm_negotiation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_negotiation"]
